name: Android - Generate Reddit Short
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Production story source: public Reddit or your script"
        type: choice
        options: [reddit, script]
        default: reddit
      reddit_subreddit:
        description: "Subreddit for a random public text post"
        type: string
        default: stories
      reddit_post_url:
        description: "Optional specific public Reddit post URL"
        type: string
        default: ""
      script_path:
        description: "For script mode: committed JSON path"
        type: string
        default: examples/android-story.json
      background:
        description: "Use permitted gameplay from YouTube URL or committed clips"
        type: choice
        options: [random]
        default: random
      gameplay_rights:
        description: "I confirm permission to reuse the fixed YouTube gameplay video"
        type: boolean
        default: false
      layout:
        description: "Full gameplay with captions or split"
        type: choice
        options: [full, split]
        default: full
      voice:
        description: "Edge TTS voice"
        type: choice
        options: [guy, jenny, ryan, sonia]
        default: guy
      captions:
        description: "Caption style (karaoke highlights current words)"
        type: choice
        options: [karaoke, bold, clean, boxed]
        default: karaoke
permissions:
  contents: read
concurrency:
  group: android-video-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg and PurffleShorts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -e . yt-dlp
      - name: Validate environment
        run: |
          python -m compileall -q purffle_shorts
          ffmpeg -hide_banner -filters | grep -E ' ass '
          python -m purffle_shorts --help
      - name: Generate production video with PurffleShorts
        env:
          MODE: ${{ inputs.mode }}
          SCRIPT_PATH: ${{ inputs.script_path }}
          REDDIT_SUBREDDIT: ${{ inputs.reddit_subreddit }}
          REDDIT_POST_URL: ${{ inputs.reddit_post_url }}
          BACKGROUND: ${{ inputs.background }}
          YOUTUBE_GAMEPLAY_URL: https://youtu.be/s3_xa3qdsks
          GAMEPLAY_RIGHTS: ${{ inputs.gameplay_rights }}
          LAYOUT: ${{ inputs.layout }}
          VOICE: ${{ inputs.voice }}
          CAPTIONS: ${{ inputs.captions }}
          DATA_DIR: ${{ github.workspace }}/android-output
          WATERMARK: none
          CAPTION_EMPHASIS: 'true'
          TTS_ENGINE: edge
        run: python tools/android_video.py
      - name: Verify rendered MP4 and metadata
        run: python tools/check_android_video.py output_videos
      - name: Upload MP4, captions and cover
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-reddit-short
          path: |
            output_videos/**/*.mp4
            output_videos/**/*.srt
            output_videos/**/cover.jpg
            output_videos/**/metadata.json
          if-no-files-found: error
          retention-days: 7
