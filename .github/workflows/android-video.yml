name: Android - Generate Reddit Short
on:
  workflow_dispatch:
    inputs:
      reddit_manual_title:
        description: "Video title"
        type: string
        required: true
      reddit_manual_body:
        description: "Post text"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: android-video-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install npm YouTube downloader
        run: npm install --no-save --no-package-lock @distube/ytdl-core@5.2.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg and PurffleShorts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -e . "yt-dlp[default]"
      - name: Configure YouTube JavaScript runtime
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Validate environment
        run: |
          python -m compileall -q purffle_shorts
          ffmpeg -hide_banner -filters | grep -E ' ass '
          python -m purffle_shorts --help
      - name: Generate production video with PurffleShorts
        env:
          MODE: reddit
          REDDIT_MANUAL_TITLE: ${{ inputs.reddit_manual_title }}
          REDDIT_MANUAL_BODY: ${{ inputs.reddit_manual_body }}
          BACKGROUND: random
          YOUTUBE_GAMEPLAY_URL: https://youtu.be/s3_xa3qdsks
          LAYOUT: full
          VOICE: guy
          CAPTIONS: karaoke
          DATA_DIR: ${{ github.workspace }}/android-output
          WATERMARK: none
          CAPTION_EMPHASIS: 'true'
          TTS_ENGINE: edge
        run: python tools/android_video.py
      - name: Verify rendered MP4 and metadata
        run: python tools/check_android_video.py output_videos
      - name: Upload MP4, captions and cover
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-reddit-short
          path: |
            output_videos/**/*.mp4
            output_videos/**/*.srt
            output_videos/**/cover.jpg
            output_videos/**/metadata.json
          if-no-files-found: error
          retention-days: 7
